[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-compute-routing"
version = "0.1.0"
description = "Reproducible LEO computing-aware routing experiment platform"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "networkx>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=6.2"]
plots = ["matplotlib>=3.4"]
rl = ["torch>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
