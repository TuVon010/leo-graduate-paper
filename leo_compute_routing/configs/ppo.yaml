# Satellite-only PPO; graph routing happens AFTER node selection.
extends: base.yaml
rl:
  encoder: gat
  hidden_dim: 64
  gat_heads: 4
  gat_layers: 2
  use_future: true
  use_mask: true
  use_reservations: true
  time_scale_seconds: 1.0
  value_scale: 100.0
  learning_rate: 0.0001
  gamma: 0.995
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.002
  max_grad_norm: 0.5
  epochs: 4
  minibatch_steps: 64
  target_kl: 0.03
  updates: 200
  episodes_per_update: 2
  seed: 2026
  device: auto
  torch_threads: 1
  train_seeds:
  - 2026
  validation_seeds:
  - 100
  validation_every: 5
  checkpoint_every: 10
